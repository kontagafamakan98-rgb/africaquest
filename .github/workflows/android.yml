# The one artifact that is not the site.
#
# The application is a web application, and Capacitor wraps the same build in a
# native Android shell, so the game is installed rather than bookmarked and
# works with no network at all. Nothing here changes what the site publishes: it
# is the same `dist`, copied into the native project by `npm run android:sync`.
#
# The APK is assembled here rather than on a laptop because Gradle needs a JDK
# and the Android SDK, and the runner brings both. It is started by hand and on a
# version tag, not on every push to main: a wrapper is not rebuilt for a change
# that only the site cares about.
#
# A version tag does two things a hand-held run cannot. It decides the version,
# and the APK is attached to the release that tag names, so a download link
# handed to somebody keeps working: an artifact is the copy that expires, and a
# version is the one people mean to keep. It is also signed, because a device
# refuses an unsigned APK and the debug key is a key every debug build anywhere
# shares. The signing key is four repository secrets, and ANDROID_RELEASE.md says
# how they are made: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. A run without them still builds the
# debug APK; a version tag without them fails before the build, since a release
# nobody can install is worse than a red run.
name: Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Read here rather than on the step, because whether there is a key at all
      # is what decides which of the steps below run: a secret a run was not
      # given arrives as an empty string, which is the one honest signal that
      # there is nothing to sign with.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Before the build rather than after it: a version tag that cannot produce
      # the APK its release is for should not spend minutes finding that out, and
      # it must not leave a release behind that nobody can install from.
      - name: Refuse a version tag there is no signing key for
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error title=No signing key::A version tag publishes an APK for a device to install, and a device refuses one that is unsigned. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets, the way ANDROID_RELEASE.md describes, and push the tag again."
          exit 1

      - name: Install the Node version the app is built with
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The template targets Android 35 and Gradle 8.11, which wants a JDK newer
      # than the one Gradle stopped supporting: 21 is the line the Android tools
      # are on today.
      - name: Install the JDK Gradle runs on
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # v4 rather than v3: the older release still installed the `tools` package,
      # which Google stopped serving, and the run failed on a package that no
      # longer exists rather than on the build.
      - name: Install the Android SDK
        uses: android-actions/setup-android@v4

      # The platform and the build tools the native project names, installed
      # rather than assumed: a runner that carries a different one fails on a
      # build that would have gone through, which reads as a broken project.
      - name: Install the SDK platform and build tools the build asks for
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install the dependencies from the lockfile
        run: npm ci

      - name: Build the application and copy it into the native project
        run: npm run android:sync

      # The version the release is named after, worked out from the tag rather
      # than typed: the number the installed app reports, the name of the file
      # somebody downloads and the tag are then the same three numbers, and none
      # of them can drift from the others.
      - name: Write the version the tag names
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/android-version.mjs "$GITHUB_REF_NAME"

      # A secret is text, so the key travels as base64 and is decoded into the
      # runner's temporary directory rather than the checkout: the key is not a
      # file of this repository, and the machine it is written on is thrown away
      # with the run.
      - name: Decode the key the release is signed with
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      # The wrapper is committed from a Windows machine, where the executable bit
      # is not a thing: the checkout arrives with the file present but not
      # runnable, and one chmod is the whole difference.
      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # The four names android/app/build.gradle reads, and the reason they are
      # environment variables rather than -P arguments: a property is part of the
      # command line, and a command line is what a process list and a build scan
      # show. The key file is the one decoded above, which is why this step and
      # that one share a condition.
      - name: Build the signed release APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Kept as well as released: a hand-held run has no tag to hang a release
      # on, and the artifact is what somebody downloads the same day.
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: africa-history-quest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The file the release carries. Named for the debug one rather than for
      # both, so that the job that publishes a release reads one artifact and
      # cannot pick up the debug build by accident.
      - name: Keep the signed APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: africa-history-quest-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # A job of its own rather than two more steps in the one above, for the reason
  # the site is published from a second job as well: a build that compiles
  # whatever a pull request contains is not the same trust as one allowed to
  # write to the repository, and the write is only ever a release.
  release:
    name: Attach the APK to the release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # The signed file rather than the debug one, which is what makes the
      # download something a device installs without being told to trust the
      # machine it came from.
      - name: Take the signed APK the build produced
        uses: actions/download-artifact@v4
        with:
          name: africa-history-quest-apk-release
          path: apk

      # `gh` rather than an action of its own: the runner carries the command,
      # and the release is created here so that pushing a tag twice, or pushing a
      # tag whose build failed once, leaves one release rather than an error. The
      # file is uploaded under the version rather than under the name Gradle gave
      # it, so two releases do not arrive on a disk as two files called
      # app-release.apk.
      - name: Publish the release this tag names
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes "Africa History Quest $TAG. It opens from a home screen and runs with no network at all, and the progress it saves stays on the device. Signed, so a device installs it the way it installs any other application."
          gh release upload "$TAG" "apk/app-release.apk#africa-history-quest-${TAG#v}.apk" --clobber --repo "$GITHUB_REPOSITORY"
