# What has to be true before a change reaches main.
#
# One command decides: `npm run verify` runs the translation check, the photo
# budget, the icon set, the tests, ESLint, a production build and the weight of
# that build, in that order, and stops at the first failure. It is the same
# command a developer runs on their machine, so a green run here means what a
# green run there means.
#
# Two things the runner does not bring on its own are installed first: the Node
# version named in .nvmrc, and Pillow, the image library the photograph check
# reads JPEG pixels through. Without Pillow the photo step fails, and the
# failure looks like a broken gallery rather than a missing dependency.
#
# The same command runs a second time, on a Windows runner, and not as a nicety:
# the game is written on Windows and the installer is assembled there, so a
# checkout arrives with CRLF, a path is written with a backslash, and a script
# that reads a committed file for a newline meets bytes the writer never put
# there. None of that is hypothetical here. Every check passed on Linux and the
# first Windows build of the installer failed at the translation step, over the
# line ending in a lesson story, and would have failed at the next one too. So
# the two machines run the same command, and what breaks on only one of them is
# seen on the push that caused it rather than on the tag that publishes it.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

# A run whose branch has moved on is not worth finishing.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Node version the app is verified on
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the image library the photograph check reads with
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Install the dependencies from the lockfile
        run: npm ci

      # The whole verification, including the production build the service
      # worker is generated from. Nothing is published: a green run only says
      # the change is ready to be looked at.
      - name: Verify
        run: npm run verify

  # The same command, on the machine the installer is built for.
  #
  # It is a job of its own rather than a matrix over one job because the two do
  # different things with the same words: one says the change is right, the other
  # says Windows agrees with it. A failure here is about the environment rather
  # than the change, and reading it should not mean reading two machines' output
  # folded together.
  verify-windows:
    name: npm run verify (Windows)
    # A Windows runner is slower to start and slower to build through antivirus,
    # so the ceiling is higher than the Linux job's while still bounding a hang.
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        # The default shell on the runner is PowerShell, and the steps are
        # written for the shell the project's own scripts and the installer build
        # are written in, named here once rather than on every step.
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Node version the app is verified on
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the image library the photograph check reads with
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Install the dependencies from the lockfile
        run: npm ci

      # The whole verification again, this time on the files as Windows checks
      # them out. It ends with the same production build the Linux job reads, so
      # the two runs say the same thing about the same commit.
      - name: Verify
        run: npm run verify
