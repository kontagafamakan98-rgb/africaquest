# The installer that is not the site and not the phone build.
#
# The game is a web application, and three shells hand the same `dist` to three
# kinds of machine: GitHub Pages serves it to a browser, Capacitor wraps it for
# Android, and electron/ opens it in a window of its own on Windows. Nothing here
# changes what the site publishes: the installer carries the build this workflow
# makes, and the shell around it.
#
# The installer is assembled here rather than on a laptop because the person who
# asked for one should be able to hand out a file rather than a repository, and
# because the artifact of a version tag has to keep working: a release asset is
# the copy somebody keeps, where a build artifact expires. It is started by hand
# and on a version tag, not on every push to main: an installer is not rebuilt
# for a change that only the site cares about.
#
# It is not signed, and that is a decision rather than an oversight. A
# certificate for a Windows program costs a few hundred pounds a year and
# belongs to a named company, and neither is something this project has. What
# Windows shows the reader without one is SmartScreen's "unrecognised app" the
# first time the installer is run, which is what WINDOWS_RELEASE.md explains,
# and what the page that hands the file out should say too.
name: Desktop

on:
  workflow_dispatch:
    inputs:
      # A tag to name the installer after, when the run is started by hand rather
      # than by pushing one. Left empty, the version in package.json is used, so
      # a hand-held run still produces a file with a version in its name.
      version:
        description: "A version to name the installer after, like v1.0.8. Empty: the version in package.json."
        required: false
        default: ""
      # A release to read back, so that the check which runs after a tag can also
      # be asked for on a release that is already published, without pushing a
      # tag that would publish another one. Left empty, a hand-held run builds
      # and reads nothing back.
      verify-tag:
        description: "A published release to read back, like v1.0.8. Empty: build only."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    name: Build the Windows installer
    # Windows, because the installer is a Windows program and the shell it wraps
    # is one: electron-builder can cross-build a few formats but not this one,
    # and a runner that is not Windows would be the wrong place to find out.
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        # The runner's default shell on Windows is PowerShell, and the steps
        # below are written the shell this project's own scripts are written in:
        # named here once rather than repeated on every step.
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Node version the app is built with
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the dependencies from the lockfile
        run: npm ci

      # The version the release is named after, written into the manifest the
      # installer reads: the name of the file somebody downloads, the number in
      # Apps and features and the tag are then the same three numbers, and none
      # of them can drift from the others. A run by hand that named no version
      # keeps the one the repository carries, which is what a build on a laptop
      # produces too.
      - name: Write the version the run names
        env:
          NAMED: ${{ inputs.version || github.ref_name }}
        if: startsWith(env.NAMED, 'v')
        run: npm version "${NAMED#v}" --no-git-tag-version --allow-same-version

      # The build, then the runtime, then electron-builder: the runtime step is
      # the one that matters here, because a fresh checkout is where npm's
      # approval list for install scripts is easy to get wrong, and a runner that
      # skipped Electron's would fail three steps later with a message about a
      # folder that does not exist. It fetches nothing when the install already
      # did, which is the ordinary case.
      - name: Build the site and the installer
        run: npm run desktop:build

      # Kept as well as released: a hand-held run has no tag to hang a release
      # on, and the artifact is what somebody downloads the same day.
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: africa-history-quest-windows-setup
          path: release/*.exe
          if-no-files-found: error

  # A job of its own rather than two more steps in the one above, for the reason
  # the APK is published from a second job: a build that compiles whatever a pull
  # request contains is not the same trust as one allowed to write to the
  # repository, and the write is only ever a release.
  release:
    name: Attach the installer to the release
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Take the installer the build produced
        uses: actions/download-artifact@v4
        with:
          name: africa-history-quest-windows-setup
          path: setup

      # `gh` rather than an action of its own: the runner carries the command,
      # and the release is created here so that pushing a tag twice leaves one
      # release rather than an error.
      #
      # The loop is for the second publisher of the same tag. A version tag
      # starts this workflow and the Android one, and both attach a file to the
      # release that tag names: whichever of the two creates it, the other finds
      # it already there and uploads into it. Without the retry, the two racing
      # each other would leave one of them red for having lost a race rather than
      # for having failed.
      - name: Publish the release this tag names
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for attempt in 1 2 3; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes "Africa History Quest $TAG, for Windows. The installer puts a shortcut on the desktop and an entry in Apps and features, and the game plays with no network at all. It is not code signed, so Windows may show a SmartScreen warning the first time it is run: choose More info, then Run anyway." && break
            sleep 5
          done
          gh release upload "$TAG" "setup/Africa-History-Quest-Setup-${TAG#v}.exe" --clobber --repo "$GITHUB_REPOSITORY"

  # The file a reader is given, read back from the release it was published to.
  #
  # Everything above works on what the build produced: the artifact the build
  # kept, the name it was uploaded under, the version the manifest was given. The
  # asset on the release page is a copy, and this is the only place that reads the
  # copy a reader downloads. It fails the run rather than withdrawing anything: an
  # installer already published is not un-published by a red mark, and the run is
  # where somebody can still see which of the promises went wrong.
  #
  # A job of its own rather than three more steps in the release above, for the
  # reason the release is a job of its own: publishing and checking are different
  # trust, and a check that lived beside the write would be read as part of it.
  #
  # It runs on Linux although the file is a Windows program, because reading it
  # is Node reading bytes: the version a Windows program carries is in the file
  # itself, and the check asks no tool and no PowerShell for it. That is also why
  # it needs no `npm ci` here, exactly as the APK check reads its file with the
  # tools on PATH rather than with the project's own dependencies.
  verify:
    name: Read the published installer
    needs: release
    # A tag publishes and then reads itself back. A run by hand may name a release
    # that is already out, which is how the check is tried on an old release
    # without a tag that would publish another one. `always()` because a release
    # job that did not run - a hand-held build - must not take the check with it.
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.verify-tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The tag the release is named after, whether it is the one that pushed this
      # run or the one a hand-held run asked about.
      TAG: ${{ inputs.verify-tag || github.ref_name }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Node version the app is verified on
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # What a reader's browser is sent to, asked of the release rather than of
      # the run: the two are the same file only because the release job uploaded
      # one, and that is exactly what this job is here to notice.
      - name: Download the asset the release carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Africa-History-Quest-Setup-*.exe' --dir published
          ls -l published

      - name: Read the version and the name back out of the file
        run: npm run check:desktop -- --exe "$(ls published/*.exe)" --tag "$TAG"
