# Asks the published site, once a day, whether it is still there.
#
# Nothing here is a server: the application is a folder of files on GitHub Pages,
# and the way it fails is quiet. A half finished deployment, a repository whose
# Pages setting was changed, a build that published an empty directory: in every
# one of them the address still answers, and what it answers with is not the
# application. So the check reads the four files that say what the site is, and
# fails when one of them is not what it should be (see scripts/check-site.mjs).
#
# A failing scheduled run is what tells the publisher: GitHub notifies the owner
# of a workflow that failed, in the app and by email, which is why there is no
# third party watching the site and no secret in this file. A run that succeeds
# says nothing to anybody, which is the point.
#
# It is deliberately not part of the Verify workflow: the gate decides whether a
# change belongs on main, and this says whether what was published is reachable,
# which depends on a host rather than on the code.
#
# A second step asks the same question of the backend, which is a Neon function
# with the branch's database behind it and is not part of the game at all. That
# one is asleep most of the day on purpose - a Neon compute scales to zero after
# a few idle minutes - so the check is written to tell a service that is really
# gone from one that is merely suspended, and to say which it found rather than
# to fail on the sleep (see scripts/check-backend.mjs). Its address is a public
# invocation URL, carried as a repository variable and not a secret: a
# repository that has not set it gets a line saying the check was skipped.
name: Uptime

on:
  schedule:
    # 06:17 UTC rather than on the hour: a check that runs with everybody else's
    # is a check that waits for its turn.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Ask the published site whether it is still there
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Node version the app is verified on
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # No install step: this script reads files over the network and imports
      # nothing outside the repository.
      - name: Read the published site
        run: node scripts/check-site.mjs

      # The backend is a Neon function with the database behind it, and it is
      # asleep most of the day on purpose: the compute scales to zero after a few
      # idle minutes, and a suspended database still answers the next request,
      # after waking. So this asks whether the function and the base are really
      # gone, and reports a slow answer after a sleep as a sleep rather than as
      # an outage (see scripts/check-backend.mjs). The address is the function's
      # invocation URL, kept in a repository variable rather than in this file so
      # that a project whose function has moved runs the check and says it is
      # unconfigured instead of failing on somebody else's name. It needs no
      # install for the same reason the site check does not: nothing outside the
      # repository is imported.
      - name: Ask the backend whether it is awake, rather than whether it is up
        env:
          NEON_FUNCTION_API_BASE_URL: ${{ vars.NEON_FUNCTION_API_BASE_URL }}
        run: node scripts/check-backend.mjs
